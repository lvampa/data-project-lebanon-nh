version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      # Majors come as their own PRs, since they can need code changes.
      python:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: bun
    directory: /frontend
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      # Majors come as their own PRs, since they can need code changes.
      frontend:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # typescript-eslint supports TypeScript below 6.1 as of 8.72.1. Drop this once it supports 7.
      - dependency-name: typescript
        versions: [">=7"]
      # Dependabot can't read frontend/.nvmrc. Bump this with the Node version.
      - dependency-name: "@types/node"
        versions: [">=27"]

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      # Majors come as their own PRs, since they can need code changes.
      docker:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Rust and uv are pinned in ci.yml too. Bump them together by hand.
      # Python stays on 3.12 with .python-version, ruff's target-version and the Airflow
      # image. Dependabot reads python:3.12-slim as 3.12 and would group a bump to 3.13
      # with the routine ones.
      - dependency-name: rust
      - dependency-name: ghcr.io/astral-sh/uv
      - dependency-name: python

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      # Majors come as their own PRs. A Postgres major needs a dump and restore,
      # and `postgresql-client-16` in docker/Dockerfile.airflow bumped with it, or pg_dump
      # refuses the newer server.
      compose:
        patterns: ["*"]
        update-types: [minor, patch]
