name: Deploy

# The static site, built and uploaded to Cloudflare Pages when code merges to main.
# There is no `needs: ci-ok` here: `ci-ok` must be a required check on pull requests, so
# what merges has passed, and scripts/deploy.sh fails on a broken build. No pull_request
# trigger, no workflow_run and no manual trigger. A redeploy is "Re-run all jobs" on the last
# run, and another branch deploys with a local scripts/deploy.sh.
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "scripts/deploy.sh"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Secrets live in this environment, which is limited to main in the repository settings.
    environment: production
    # A second deploy waits for the first. Cancelling one mid-upload could leave a
    # half-finished deployment.
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: frontend/package.json

      # Wrangler runs on Node and needs 22.12 or newer.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # One entrypoint for the build and the upload, so a hand run and CI cannot drift.
      # The script keeps these variables away from the install and the build.
      - name: Build and deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          # Unset until the data host exists, and then the pages read /data.
          NEXT_PUBLIC_DATA_URL: ${{ vars.NEXT_PUBLIC_DATA_URL }}
        run: bash scripts/deploy.sh
