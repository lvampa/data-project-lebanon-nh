[project]
name = "api"
version = "0.1.0"
description = "Lebanon, NH public records API: incidents, addresses, LLCs, and search"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "httpx>=0.27.0",
    "locations",
    "logfire[fastapi]>=4.31.0",
    "python-dotenv>=1.0.0",
    "postgres",
    "pydantic-settings>=2.14.1",
]

[tool.uv.sources]
locations = { workspace = true }
postgres = { workspace = true }

[tool.pytest.ini_options]
pythonpath = ["."]
