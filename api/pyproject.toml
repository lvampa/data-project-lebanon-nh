[project]
name = "api"
version = "0.1.0"
description = "Lebanon PD Log — internal dashboard API"
requires-python = ">=3.12"
dependencies = [
    "elasticsearch>=8.13,<9",
    "fastapi[standard]>=0.115.0",
    "httpx>=0.27.0",
    "logfire[fastapi]>=4.31.0",
    "python-dotenv>=1.0.0",
    "postgres",
    "pydantic-settings>=2.14.1",
]

[tool.uv.sources]
postgres = { workspace = true }

[tool.pytest.ini_options]
pythonpath = ["."]
