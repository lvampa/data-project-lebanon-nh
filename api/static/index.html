<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lebanon PD Log</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <nav class="navbar navbar-dark bg-dark px-3 mb-3">
    <span class="navbar-brand">Lebanon PD Log</span>
    <ul class="nav nav-pills" id="nav-tabs">
      <li class="nav-item"><a class="nav-link active" href="#" onclick="showTab('incidents');return false;">Incidents</a></li>
      <li class="nav-item"><a class="nav-link" href="#" onclick="showTab('stats');return false;">Stats</a></li>
      <li class="nav-item"><a class="nav-link" href="#" onclick="showTab('addresses');return false;">Addresses</a></li>
      <li class="nav-item"><a class="nav-link" href="#" onclick="showTab('categories');return false;">Categories</a></li>
    </ul>
  </nav>

  <!-- Incidents tab -->
  <div id="tab-incidents" class="container-fluid">
    <div class="row g-2 mb-3">
      <div class="col-auto"><input type="date" id="date_from" class="form-control form-control-sm"></div>
      <div class="col-auto"><input type="date" id="date_to" class="form-control form-control-sm"></div>
      <div class="col-auto"><input type="text" id="f_type" placeholder="Incident type" class="form-control form-control-sm"></div>
      <div class="col-auto"><input type="text" id="f_officer" placeholder="Officer" class="form-control form-control-sm"></div>
      <div class="col-auto"><button class="btn btn-sm btn-primary" onclick="loadIncidents(1)">Search</button></div>
    </div>
    <table class="table table-sm table-hover table-bordered">
      <thead class="table-dark">
        <tr><th>Date/Time</th><th>Case #</th><th>Type</th><th>Disposition</th><th>Location</th><th>Officer</th></tr>
      </thead>
      <tbody id="incidents-body"></tbody>
    </table>
    <div id="incidents-pagination" class="d-flex gap-2 align-items-center"></div>
  </div>

  <!-- Stats tab -->
  <div id="tab-stats" class="container-fluid d-none">
    <div class="row">
      <div class="col-md-6 mb-4"><canvas id="chart-type"></canvas></div>
      <div class="col-md-6 mb-4"><canvas id="chart-hour"></canvas></div>
      <div class="col-md-6 mb-4"><canvas id="chart-weekday"></canvas></div>
    </div>
  </div>

  <!-- Addresses tab -->
  <div id="tab-addresses" class="container-fluid d-none">
    <table class="table table-sm table-hover table-bordered">
      <thead class="table-dark">
        <tr><th>Raw Address</th><th>Normalized</th><th>Lat</th><th>Lng</th><th>Count</th><th></th></tr>
      </thead>
      <tbody id="addresses-body"></tbody>
    </table>
  </div>

  <!-- Categories tab -->
  <div id="tab-categories" class="container-fluid d-none">
    <table class="table table-sm table-hover table-bordered">
      <thead class="table-dark">
        <tr><th>Incident Type</th><th>Category</th><th>Subcategory</th><th>Count</th><th></th></tr>
      </thead>
      <tbody id="categories-body"></tbody>
    </table>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
