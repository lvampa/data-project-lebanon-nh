x-airflow-common:
  &airflow-common
  build:
    context: .
    dockerfile: docker/Dockerfile.airflow
  environment:
    &airflow-env
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:?see .env.example}@postgres/airflow
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?see .env.example}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:?see .env.example}
    MONGO_HOST: mongo
    MONGO_PORT: "27017"
    MONGO_USER: ${MONGO_USER:-admin}
    MONGO_PASSWORD: ${MONGO_PASSWORD:?see .env.example}
    MONGO_DB: ${MONGO_DB:-scraped_data}
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_USER: ${POSTGRES_USER:-app}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?see .env.example}
    POSTGRES_DB: ${POSTGRES_DB:-app}
  volumes:
    &airflow-volumes
    - ./dags:/opt/airflow/dags
    - ./scrapers:/opt/project/scrapers
    - ./shared:/opt/project/shared
    - ./scripts:/opt/project/scripts
    - airflow_logs:/opt/airflow/logs
    # The backup scripts write here. ${HOME} keeps the path absolute.
    - ${MONGO_BACKUP_DIR:-${HOME}/backups/data-project/mongo}:/opt/backups/mongo
    - ${POSTGRES_BACKUP_DIR:-${HOME}/backups/data-project/postgres}:/opt/backups/postgres
  depends_on:
    &airflow-depends
    postgres:
      condition: service_healthy

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?see .env.example}
      POSTGRES_DB: ${POSTGRES_DB:-app}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:?see .env.example}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  mongo:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?see .env.example}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      retries: 5

  postgres:
    image: postgres:16
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?see .env.example}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-app}"]
      interval: 10s
      retries: 5

  airflow-init:
    <<: *airflow-common
    restart: "no"
    environment:
      <<: *airflow-env
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_PASSWORD:?see .env.example}
    entrypoint: /bin/bash
    command:
      - -c
      - >-
        airflow db migrate &&
        (airflow users create
        --username $$_AIRFLOW_WWW_USER_USERNAME
        --password $$_AIRFLOW_WWW_USER_PASSWORD
        --firstname Admin --lastname User --role Admin
        --email admin@example.com || true)

  # Applies the Postgres migrations and creates the MongoDB indexes once, so no job
  # or API request sees an old schema.
  migrate:
    <<: *airflow-common
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    entrypoint: /bin/bash
    command:
      - -c
      - >-
        /opt/project/.venv/bin/alembic -c /opt/project/shared/postgres/alembic.ini upgrade head &&
        /opt/project/.venv/bin/python -c "from mongo import init_indexes; init_indexes()"

  airflow-webserver:
    <<: *airflow-common
    restart: unless-stopped
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"
    command: webserver

  airflow-scheduler:
    <<: *airflow-common
    restart: unless-stopped
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *airflow-env
      AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "30"
    command: scheduler

volumes:
  mongo_data:
  postgres_data:
  airflow_logs:
