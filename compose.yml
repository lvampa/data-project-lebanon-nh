x-postgres-env: &postgres-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: ${POSTGRES_USER:-app}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?see .env.example}
  POSTGRES_DB: ${POSTGRES_DB:-app}

x-mongo-env: &mongo-env
  MONGO_HOST: mongo
  MONGO_PORT: "27017"
  MONGO_USER: ${MONGO_USER:-admin}
  MONGO_PASSWORD: ${MONGO_PASSWORD:?see .env.example}
  MONGO_DB: ${MONGO_DB:-scraped_data}

x-airflow-common: &airflow-common
  # One image for every Airflow service, so compose builds it once.
  image: data-project-airflow:local
  build:
    context: .
    dockerfile: docker/Dockerfile.airflow
  environment: &airflow-env
    <<: [*postgres-env, *mongo-env]
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    # No login: the simple auth manager makes everyone an admin. That is safe only because the
    # UI listens on 127.0.0.1. Add a login before exposing it.
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?see .env.example}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?see .env.example}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:?see .env.example}@postgres/airflow
    AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "30"
    AIRFLOW__API__DEFAULT_UI_TIMEZONE: America/New_York
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_SECRET_KEY:?see .env.example}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./scrapers:/opt/project/scrapers
    - ./shared:/opt/project/shared
    - ./scripts:/opt/project/scripts
    - airflow_logs:/opt/airflow/logs
    # The backup scripts write here. ${HOME} keeps the path absolute.
    - ${MONGO_BACKUP_DIR:-${HOME}/backups/data-project/mongo}:/opt/backups/mongo
    - ${POSTGRES_BACKUP_DIR:-${HOME}/backups/data-project/postgres}:/opt/backups/postgres
  depends_on: &airflow-depends
    postgres:
      condition: service_healthy
    mongo:
      condition: service_healthy

# The long-running Airflow services start once airflow-init has migrated the database.
x-airflow-service: &airflow-service
  <<: *airflow-common
  restart: unless-stopped
  depends_on:
    <<: *airflow-depends
    airflow-init:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?see .env.example}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-app}"]
      interval: 10s
      retries: 5

  mongo:
    image: mongo:8.3
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?see .env.example}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      retries: 5

  api:
    image: data-project-api:local
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    volumes:
      - ./api:/opt/project/api
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      <<: *postgres-env
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:?see .env.example}
    depends_on:
      postgres:
        condition: service_healthy

  airflow-init:
    <<: *airflow-common
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: "true"
    # The entrypoint migrates the database before it runs this.
    command: version

  airflow-api-server:
    <<: *airflow-service
    ports:
      - "127.0.0.1:8080:8080"
    command: api-server
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  airflow-scheduler:
    <<: *airflow-service
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 30s

  airflow-dag-processor:
    <<: *airflow-service
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
  mongo_data:
  airflow_logs:
