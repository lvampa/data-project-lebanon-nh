x-airflow-common:
  &airflow-common
  build:
    context: .
    dockerfile: docker/Dockerfile.airflow
  environment:
    &airflow-env
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres/airflow
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
    MONGO_HOST: mongo
    MONGO_PORT: "27017"
    MONGO_USER: ${MONGO_USER:-admin}
    MONGO_PASSWORD: ${MONGO_PASSWORD:-changeme}
    MONGO_DB: ${MONGO_DB:-scraped_data}
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_USER: ${POSTGRES_USER:-app}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    POSTGRES_DB: ${POSTGRES_DB:-app}
    UV_PROJECT_ENVIRONMENT: /opt/airflow/.scrapers-venv
  volumes:
    &airflow-volumes
    - ./scrapers/dags:/opt/airflow/dags
    - ./scrapers:/opt/project/scrapers
    - ./shared:/opt/project/shared
    - ./pyproject.toml:/opt/project/pyproject.toml:ro
    - ./uv.lock:/opt/project/uv.lock:ro
    - airflow_logs:/opt/airflow/logs
  depends_on:
    &airflow-depends
    postgres:
      condition: service_healthy

services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-changeme}
    volumes:
      - mongo_data:/data/db

  postgres:
    image: postgres:16
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-app}"]
      interval: 10s
      retries: 5

  airflow-init:
    <<: *airflow-common
    restart: "no"
    environment:
      <<: *airflow-env
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_PASSWORD:-admin}
    entrypoint: /bin/bash
    command:
      - -c
      - >-
        airflow db migrate &&
        (airflow users create
        --username $$_AIRFLOW_WWW_USER_USERNAME
        --password $$_AIRFLOW_WWW_USER_PASSWORD
        --firstname Admin --lastname User --role Admin
        --email admin@example.com || true)

  airflow-webserver:
    <<: *airflow-common
    restart: unless-stopped
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    command: webserver

  airflow-scheduler:
    <<: *airflow-common
    restart: unless-stopped
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully
    environment:
      <<: *airflow-env
      AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "30"
    command: scheduler

volumes:
  mongo_data:
  postgres_data:
  airflow_logs:
