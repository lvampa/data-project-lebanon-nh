<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lebanon NH Police Log</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="site-header">
    <h1>Lebanon NH Police Dispatch Log</h1>
    <p>Public data sourced from <a href="https://www.lebanonnh.gov/232/Daily-Police-Log" style="color:#aad4ff">Lebanon NH Police Department</a> · Updated weekly</p>
  </div>

  <div style="max-width:1200px;margin:0 auto;padding:0 1rem">

    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem;margin-bottom:1.5rem">
      <div class="stat-card"><div class="number" id="stat-total">—</div><div class="label">Total Incidents</div></div>
      <div class="stat-card"><div class="number" id="stat-range" style="font-size:1rem">—</div><div class="label">Date Range</div></div>
      <div class="stat-card"><div class="number" id="stat-updated" style="font-size:1rem">—</div><div class="label">Last Updated</div></div>
    </div>

    <div class="chart-grid">
      <div class="chart-card">
        <div class="section-title">Top Incident Categories (last year)</div>
        <canvas id="chart-type"></canvas>
      </div>
    </div>

    <div class="section-title" style="margin-top:1.5rem">Recent Incidents (last year)</div>
    <div class="filter-bar">
      <input type="text" id="f-search" placeholder="Search…">
      <input type="text" id="f-type" placeholder="Filter by type…">
    </div>
    <table>
      <thead>
        <tr><th>Date/Time</th><th>Case #</th><th>Type</th><th>Disposition</th><th>Location</th><th>Officer</th></tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
    <div class="pagination" id="pagination"></div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
