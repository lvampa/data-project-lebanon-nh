[tool.uv.workspace]
members = ["scrapers", "scripts", "shared/postgres", "shared/mongo", "api"]


[dependency-groups]
dev = [
    "beautifulsoup4>=4.15.0",
    "elasticsearch>=8.13,<9",
    "playwright>=1.64.1",
    "playwright-stealth>=2.0.3",
    "pre-commit>=4.7.0",
    "pyrefly==1.4.1",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
# pytest stats every entry in the folder it collects from, `.env` included. In the
# agents' Claude Code sandbox that read is denied, and collection stops with a
# PermissionError (Python 3.12's Path.is_dir raises on it). Skip these before pytest
# looks. The leading `/` is needed: pytest makes each glob absolute, and fnmatch's `*`
# crosses slashes, so it matches a `.env` at any depth.
addopts = ["--ignore-glob=/*/.env", "--ignore-glob=/*/.env.*"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "ANN"]
ignore = ["E501", "E402"]

[tool.ruff.lint.flake8-annotations]
# `*args: Any, **kwargs: Any` passed straight through to a parent class is fine.
allow-star-arg-any = true

[tool.ruff.lint.per-file-ignores]
# Tests take pytest fixtures by name; the same rule as the pyrefly config.
"**/tests/**" = ["ANN"]
# Not yet strict: code written before annotations were required. Remove a line once
# its file is annotated. The list under [tool.pyrefly] also covers paths that already
# pass these rules but not pyrefly's implicit-Any check.
"scripts/**" = ["ANN"]
"scrapers/spiders/vgsi_property.py" = ["ANN"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
# Ruff 0.17 formats Python code blocks in Markdown. The spec docs show signatures with
# aligned trailing comments, which it would reflow, so leave Markdown alone.
exclude = ["*.md"]

[tool.pyrefly]
# Strict everywhere, except the files listed under "Not yet strict" below.
preset = "strict"
project-includes = ["api", "dags", "scrapers", "scripts", "shared"]
# Scrapy runs from scrapers/ and Airflow from dags/, so modules in those folders
# import each other by top-level name (`from items import ...`).
search-path = [".", "scrapers", "dags"]
# Airflow and pendulum are installed in the Airflow image, not in the workspace venv.
ignore-missing-imports = ["airflow.*", "pendulum.*"]
# Real errors that existed when type checking was added, listed so that only new
# ones fail. Fix one, then run `uv run pyrefly check --update-baseline` to drop it.
baseline = "pyrefly-baseline.json"
# Each existing error has to stay in its place in its file, so a new error in a
# baselined file still fails.
baseline-matching-mode = "column-ordered"

# Tests take pytest fixtures by name, so annotating every parameter adds noise.
# Every other check stays on for them.
[[tool.pyrefly.sub-config]]
matches = "**/tests/**"
errors = { implicit-any = false, missing-override-decorator = false }

# Not yet strict: code written before type checking. Remove a block once its file
# passes the strict checks. Each block takes one glob; `matches` does not accept a
# list. Ruff's ANN ignores cover the same paths, less the ones that already pass them:
# the four api files, llc.py, scrapers/settings.py and the incident categorizer.
[[tool.pyrefly.sub-config]]
matches = "api/deps.py"
errors = { implicit-any = false, missing-override-decorator = false }

[[tool.pyrefly.sub-config]]
matches = "api/routers/search.py"
errors = { implicit-any = false, missing-override-decorator = false }

[[tool.pyrefly.sub-config]]
matches = "api/services/addresses.py"
errors = { implicit-any = false, missing-override-decorator = false }

[[tool.pyrefly.sub-config]]
matches = "api/services/categories.py"
errors = { implicit-any = false, missing-override-decorator = false }

[[tool.pyrefly.sub-config]]
matches = "scripts/**"
errors = { implicit-any = false, missing-override-decorator = false }

[[tool.pyrefly.sub-config]]
matches = "shared/postgres/src/postgres/models/llc.py"
errors = { implicit-any = false, missing-override-decorator = false }

[[tool.pyrefly.sub-config]]
matches = "scrapers/settings.py"
errors = { implicit-any = false, missing-override-decorator = false }

[[tool.pyrefly.sub-config]]
matches = "scrapers/maintenance/categorize_incident_types.py"
errors = { implicit-any = false, missing-override-decorator = false }

[[tool.pyrefly.sub-config]]
matches = "scrapers/spiders/vgsi_property.py"
errors = { implicit-any = false, missing-override-decorator = false }
