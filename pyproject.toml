[tool.uv.workspace]
members = ["scrapers", "shared/postgres", "shared/mongo", "api"]


[dependency-groups]
dev = [
    "beautifulsoup4>=4.15.0",
    "elasticsearch>=8.13,<9",
    "playwright>=1.64.1",
    "playwright-stealth>=2.0.3",
    "pre-commit>=4.7.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501", "E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
