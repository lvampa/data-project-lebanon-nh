[project]
name = "scrapers"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "logfire[pymongo]>=4.31.0",
    "mongo",
    "postgres",
    "pydantic>=2.12.5",
    "pypdf>=6.9.1",
    "python-dotenv>=1.2.2",
    "scrapy>=2.14.2",
]


[tool.uv.sources]
mongo = { workspace = true }
postgres = { workspace = true }

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
