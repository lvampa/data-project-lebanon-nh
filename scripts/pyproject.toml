[project]
name = "scripts"
version = "0.1.0"
description = "One-off and scheduled jobs: scrapers, imports, exports, and the Elasticsearch sync"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "elasticsearch>=8.13,<9",
    "httpx>=0.27.0",
    "locations",
    "logfire>=4.31.0",
    "mongo",
    "playwright>=1.60.0",
    "playwright-stealth>=2.0.3",
    "postgres",
    "pydantic>=2.12.5",
    "pypdf>=6.9.1",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.50",
]

[tool.uv.sources]
locations = { workspace = true }
mongo = { workspace = true }
postgres = { workspace = true }

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

# This directory is the `scripts` package itself, so map the package name onto
# it. uv_build only accepts a module root inside the project.
[tool.setuptools]
package-dir = { "scripts" = "." }
packages = [
    "scripts",
    "scripts.export",
    "scripts.ingest",
    "scripts.models",
    "scripts.normalize",
    "scripts.scrape",
    "scripts.sync",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
