[project]
name = "scripts"
version = "0.1.0"
description = "One-off and scheduled jobs: scrapers, imports, exports"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "beautifulsoup4>=4.15.0",
    "bootstrap",
    "httpx>=0.27.0",
    "locations",
    "logfire>=5.4.0",
    "mongo",
    "playwright>=1.64.1",
    "playwright-stealth>=2.0.3",
    "postgres",
    "pydantic>=2.12.5",
    "pypdf>=6.9.1",
    "sqlalchemy>=2.0.50",
]

[project.scripts]
migrate = "scripts.migrate:main"
normalize = "scripts.normalize.job:main"
geocode = "scripts.normalize.geocode:main"
osm-snapshot = "scripts.normalize.osm_snapshot:main"
place-sheet = "scripts.normalize.place_sheet:main"
check-export = "scripts.check_export:main"

[tool.uv.sources]
bootstrap = { workspace = true }
locations = { workspace = true }
mongo = { workspace = true }
postgres = { workspace = true }

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

# This directory is the `scripts` package itself, so map the package name onto
# it. uv_build only accepts a module root inside the project.
[tool.setuptools]
package-dir = { "scripts" = "." }
packages = [
    "scripts",
    "scripts.ingest",
    "scripts.models",
    "scripts.normalize",
    "scripts.scrape",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
