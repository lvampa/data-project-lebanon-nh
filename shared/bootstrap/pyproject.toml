[project]
name = "bootstrap"
version = "0.1.0"
description = "One setup step for every entry point: load .env, then configure Logfire"
requires-python = ">=3.12"
dependencies = [
    "logfire>=6.0.0",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# bootstrap_testing is its own top-level module so pytest can load it before any
# test module imports bootstrap.
module-name = ["bootstrap", "bootstrap_testing"]

[project.entry-points.pytest11]
bootstrap_testing = "bootstrap_testing.plugin"
