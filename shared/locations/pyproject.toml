[project]
name = "locations"
version = "0.1.0"
description = "Canonical address rules and geocoding, shared by the normalization jobs and the admin API"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27.0"]

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "locations"
