[project]
name = "mongo"
version = "0.1.0"
description = "Shared MongoDB client"
authors = [
    { name = "Connor Abdelnoor", email = "connor.abd@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pymongo>=4.19.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

# mongo_testing is its own top-level module so pytest can load it, and it can
# point MONGO_DB at the test database, before anything imports mongo.
[tool.uv.build-backend]
module-name = ["mongo", "mongo_testing"]

[project.entry-points.pytest11]
mongo_testing = "mongo_testing.plugin"
