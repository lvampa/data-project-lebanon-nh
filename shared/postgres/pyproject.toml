[project]
name = "postgres"
version = "0.1.0"
description = "Shared PostgreSQL client and migrations"
authors = [
    { name = "Connor Abdelnoor", email = "connor.abd@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "psycopg2-binary>=2.9.12",
    "sqlalchemy>=2.1.8",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
