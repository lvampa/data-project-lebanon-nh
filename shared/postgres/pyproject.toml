[project]
name = "postgres"
version = "0.1.0"
description = "Shared PostgreSQL client and migrations"
authors = [
    { name = "Connor Abdelnoor", email = "connor.abd@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "bootstrap",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.14.1",
    "sqlalchemy>=2.1.8",
]

[tool.uv.sources]
bootstrap = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

# postgres_testing is its own top-level module so pytest can load it before any
# test module imports postgres.
[tool.uv.build-backend]
module-name = ["postgres", "postgres_testing"]

[project.entry-points.pytest11]
postgres_testing = "postgres_testing.plugin"
