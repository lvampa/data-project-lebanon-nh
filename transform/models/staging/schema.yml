version: 2

models:
  - name: stg_log_entries
    description: Entries that are incidents. The disposition check is the singular test assert_no_raw_type_ends_with_disposition (14.3).
    columns:
      - name: case_number
        data_tests:
          - not_null

  - name: stg_incident_types
    columns:
      - name: incident_type_key
        data_tests:
          - unique
      - name: category
        description: Null while a type waits for its normalization.
        data_tests:
          - accepted_values:
              arguments:
                # 14.4. Must match IncidentCategory in scripts/models/incident_category.py.
                values: ["Fire", "EMS", "Police", "Traffic", "Administrative"]

  - name: stg_locations
    description: The city bounds check is the singular test assert_locations_inside_city_bounds (14.2).
    columns:
      - name: location_key
        data_tests:
          - unique
      - name: kind
        data_tests:
          - accepted_values:
              arguments:
                values: ["address", "intersection", "place", "highway"]
